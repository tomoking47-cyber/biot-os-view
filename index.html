@media (prefers-color-scheme:dark){:root{--bg:#141a21;--fg:#e6eaef;--mute:#98a3b1;--line:#2b3441;--acc:#7fb0ff;--card:#1b222b;--bad:#ff8a80}}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif}
/* [hidden] は UA の display:none。#login に display:grid を書くと**詳細度で勝ってしまい、合言葉の欄が消えない**。
   2026-09-22 に会長の携帯で「上のヘッダーが固定されて下が見えない」として出た。必ず [hidden] を後ろに置く */
#login{margin:24px auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding-block:24px;padding-inline:24px;width:min(100% - 32px,360px);display:grid;gap:12px}
#login[hidden]{display:none}
h1{font-size:16px;margin:0;font-weight:600} p{margin:0;font-size:13px;color:var(--mute);line-height:1.5}
input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{font:inherit;font-size:14px;padding:9px 12px;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
/* 画面の上に貼り付く帯は**1 行だけ**。横に溢れる分は横スクロールで見る。
   携帯では札が 3 行に折り返して画面の半分を食い、本文が見えなくなっていた */
.bar{display:none;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:3}
#tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{display:none}
.tab{font:13px system-ui;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);white-space:nowrap;flex:0 0 auto}
.tab[aria-selected=true]{border-color:var(--acc);color:var(--acc);font-weight:600}
.foot{display:none;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
/* 写しの中身は**外側の画面をそのまま伸ばして**表示する（枠の中で二重にスクロールさせない） */
#st{border:0;width:100%;min-height:60vh;background:#fff;display:none}
#busy{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 16px;font-size:13px;display:none}
