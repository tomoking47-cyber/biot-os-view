let key=null;const cache=new Map();const st=document.getElementById('st'),bar=document.getElementById('bar'),busy=document.getElementById('busy'),foot=document.getElementById('foot');
const known=new Set(M.pages.map(p=>p[0]));
// 写しの高さを中身に合わせる。枠の中でスクロールさせると、携帯では帯の下が見えなくなる
function fit(){try{const d=st.contentDocument;if(!d||!d.body)return;const h=Math.max(d.body.scrollHeight,d.documentElement.scrollHeight);if(h>80)st.style.height=(h+24)+'px';}catch(e){}}

async function dec(k){if(cache.has(k))return cache.get(k);const r=await fetch('p/'+k+'.enc',{cache:'no-cache'});if(!r.ok)throw new Error(k);const e=await r.json();
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.iv)},key,b(e.ct));const h=new TextDecoder().decode(pt);cache.set(k,h);return h;}
let pendingQ='';
async function go(k,push=true,q=''){if(!known.has(k))k='msc';pendingQ=q||'';busy.style.display='block';st.style.height='60vh';
 try{st.srcdoc=await dec(k);}catch(e){st.srcdoc='<p style="font:14px system-ui;padding:16px">このページは写しに入っていません（'+k+'）。</p>';}

 document.querySelectorAll('#tabs .tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.k===k));if(push)history.pushState({k},'','#'+k);}

 if(remember){try{localStorage.setItem(KEY,B(await crypto.subtle.exportKey('raw',kk)))}catch(e){}}
 document.getElementById('login').hidden=true;bar.style.display='flex';st.style.display='block';foot.style.display='flex';

 await go(location.hash.slice(1)||'msc',false);}
